[project]
name = "vollama"
version = "1.0.0"
description = "An accessible desktop chat client for LLMs, built with wxPython."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.14.*"

dependencies = [
    "pillow",
    "wxpython",
    "accessible_output2",
    "sounddevice",
    "soundfile",
    "appdirs",
    "pywin32; sys_platform == 'win32'",
    "pyobjc; sys_platform == 'darwin'",
    "llama-index-core",
    "llama-index-embeddings-openai-like",
    "llama-index-readers-file",
    "docx2txt",
    "cryptography",
    "openai",
    "requests",
    "tiktoken",
    "MainContentExtractor",
    "beautifulsoup4",
    "trafilatura",
    "EbookLib",
    "html2text",
    "transformers",
    # tools/content.py imports it to check a written .yaml file; the check is
    # skipped when the parser is missing, so it was never in requirements.txt.
    "pyyaml",
]

# A GUI entry point, not a console one: on Windows pip builds this against
# pythonw, so typing `vollama` opens the window without a console behind it.
# `python VOLlama.py` is still the way to watch the log go by.
[project.gui-scripts]
vollama = "vollama.__main__:main"

[dependency-groups]
# What the tests and the build need, and nothing the program itself imports.
# uv sync installs it by default; uv sync --no-dev leaves it out.
#
# PyInstaller is the published wheel, which is what almost everyone should
# build with: compiling a bootloader needs a C toolchain. build-pyinstaller
# replaces it with one built here, and the next uv sync puts this version back
# -- so re-run that script after a sync if you are using your own bootloader.
dev = [
    "pytest",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vollama"]
